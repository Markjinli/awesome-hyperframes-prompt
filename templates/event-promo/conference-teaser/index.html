<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonConf 2026 -- Conference Teaser</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --neon-pink: #FF00FF;
    --neon-cyan: #00FFFF;
    --bg-black: #0A0A0A;
    --surface-dark: #111118;
    --white: #FFFFFF;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    --font-sans: 'Inter', -apple-system, sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700;800&display=swap');

  body {
    background: #000;
    overflow: hidden;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  #hyperframes-canvas {
    position: relative;
    width: 1920px;
    height: 1080px;
    margin: 0 auto;
    overflow: hidden;
    background: var(--bg-black);
  }

  .composition {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }

  /* ===== Scanline Overlay ===== */
  .scanlines {
    position: absolute;
    inset: 0;
    z-index: 900;
    pointer-events: none;
    opacity: 0.06;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.03) 2px,
      rgba(255,255,255,0.03) 4px
    );
  }

  /* ===== Grid Background ===== */
  .grid-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.08;
    background-image:
      linear-gradient(rgba(255,0,255,0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,0,255,0.3) 1px, transparent 1px);
    background-size: 60px 60px;
    background-position: center center;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  }

  /* ===== Neon Glow Text ===== */
  .neon-pink {
    color: var(--neon-pink);
    text-shadow:
      0 0 7px var(--neon-pink),
      0 0 10px var(--neon-pink),
      0 0 21px var(--neon-pink),
      0 0 42px rgba(255,0,255,0.5);
  }

  .neon-cyan {
    color: var(--neon-cyan);
    text-shadow:
      0 0 7px var(--neon-cyan),
      0 0 10px var(--neon-cyan),
      0 0 21px var(--neon-cyan),
      0 0 42px rgba(0,255,255,0.5);
  }

  /* ===== Glitch Effect ===== */
  .glitch-text {
    position: relative;
    display: inline-block;
  }

  .glitch-text::before,
  .glitch-text::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
  }

  .glitch-text.active::before {
    color: #00FFFF;
    text-shadow: -2px 0 #00FFFF;
    opacity: 0.8;
    animation: glitchSkew 0.2s ease;
    clip-path: inset(20% 0 60% 0);
  }

  .glitch-text.active::after {
    color: #FF00FF;
    text-shadow: 2px 0 #FF00FF;
    opacity: 0.8;
    animation: glitchSkew 0.25s ease reverse;
    clip-path: inset(60% 0 20% 0);
  }

  @keyframes glitchSkew {
    0%   { transform: translate(0); }
    20%  { transform: translate(-5px, 2px); }
    40%  { transform: translate(5px, -1px); }
    60%  { transform: translate(-3px, -3px); }
    80%  { transform: translate(4px, 1px); }
    100% { transform: translate(0); }
  }

  /* ===== Glow Pulse Ring ===== */
  .glow-ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--neon-pink);
    box-shadow:
      0 0 10px var(--neon-pink),
      0 0 40px rgba(255,0,255,0.4),
      inset 0 0 10px rgba(255,0,255,0.1);
    opacity: 0;
    pointer-events: none;
  }

  /* ===== Radial Background Glow ===== */
  .bg-glow {
    position: absolute;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0;
    pointer-events: none;
  }

  .bg-glow.pink { background: rgba(255,0,255,0.12); }
  .bg-glow.cyan { background: rgba(0,255,255,0.1); }

  /* ===== Scene 1: Logo Sting ===== */
  .logo-sting {
    font-family: var(--font-mono);
    font-size: 90px;
    font-weight: 800;
    letter-spacing: -2px;
    text-align: center;
    z-index: 2;
    opacity: 0;
  }

  .date-line {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 400;
    color: var(--neon-cyan);
    letter-spacing: 6px;
    text-align: center;
    z-index: 2;
    opacity: 0;
    margin-top: 16px;
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0,255,255,0.4);
  }

  /* ===== Scene 2: Venue ===== */
  .venue-wireframe {
    position: relative;
    width: 800px;
    height: 400px;
    border: 1px solid rgba(0,255,255,0.15);
    z-index: 2;
    opacity: 0;
    perspective: 600px;
  }

  .venue-wireframe::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(0,255,255,0.1) 1px, transparent 1px),
      linear-gradient(0deg, rgba(0,255,255,0.1) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: rotateX(40deg);
    transform-origin: center bottom;
  }

  .venue-label {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--neon-cyan);
    letter-spacing: 10px;
    text-align: center;
    z-index: 2;
    opacity: 0;
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px rgba(0,255,255,0.4);
  }

  /* ===== Scene 3 & 4: Speaker Reveal ===== */
  .speaker-card {
    display: flex;
    align-items: center;
    gap: 80px;
    z-index: 2;
  }

  .speaker-photo {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    border: 4px solid var(--neon-pink);
    box-shadow:
      0 0 15px var(--neon-pink),
      0 0 40px rgba(255,0,255,0.4),
      0 0 80px rgba(255,0,255,0.15);
    opacity: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    background: radial-gradient(circle at 40% 40%, #2a1a2e, #111118);
    position: relative;
  }

  .speaker-photo.cyan-border {
    border-color: var(--neon-cyan);
    box-shadow:
      0 0 15px var(--neon-cyan),
      0 0 40px rgba(0,255,255,0.4),
      0 0 80px rgba(0,255,255,0.15);
  }

  .speaker-info {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .speaker-name {
    font-family: var(--font-mono);
    font-size: 56px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -1px;
    opacity: 0;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
  }

  .speaker-role {
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 600;
    color: var(--neon-cyan);
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: 0;
    text-shadow: 0 0 8px rgba(0,255,255,0.4);
  }

  /* ===== Scene 6: Countdown Finale ===== */
  .countdown-date {
    font-family: var(--font-mono);
    font-size: 130px;
    font-weight: 800;
    letter-spacing: 2px;
    text-align: center;
    z-index: 2;
    opacity: 0;
  }

  .countdown-venue {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 400;
    color: var(--neon-cyan);
    letter-spacing: 8px;
    text-align: center;
    z-index: 2;
    opacity: 0;
    margin-top: 12px;
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 25px rgba(0,255,255,0.3);
  }

  .cta-text {
    font-family: var(--font-sans);
    font-size: 20px;
    font-weight: 500;
    color: var(--white);
    letter-spacing: 3px;
    text-align: center;
    z-index: 2;
    opacity: 0;
    margin-top: 40px;
    text-transform: uppercase;
  }

  .cta-text::after {
    content: '';
    display: block;
    width: 0;
    height: 2px;
    background: var(--neon-pink);
    margin: 8px auto 0;
    transition: width 0.8s ease;
    box-shadow: 0 0 8px var(--neon-pink);
  }

  /* ===== Scan Line Sweep ===== */
  .scan-sweep {
    position: absolute;
    left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    opacity: 0;
    pointer-events: none;
    z-index: 950;
    box-shadow: 0 0 20px var(--neon-cyan), 0 0 60px rgba(0,255,255,0.3);
  }

  /* ===== Fast-cut transition flash ===== */
  .flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 1000;
  }

</style>
</head>
<body>

<div id="hyperframes-canvas">

  <div class="scanlines"></div>
  <div class="flash" id="flash"></div>
  <div class="scan-sweep" id="scanSweep"></div>

  <!-- ===== SCENE 1: Logo Sting + Date (0s-2.5s) ===== -->
  <div class="composition active"
       data-composition-id="scene-1-logo"
       data-start="0" data-duration="2.5" data-track-index="1">
    <div class="grid-bg"></div>
    <div class="bg-glow pink" id="glow1" style="top:50%;left:50%;transform:translate(-50%,-50%);"></div>
    <div style="display:flex;flex-direction:column;align-items:center;z-index:2;">
      <div class="logo-sting neon-pink glitch-text" id="logoSting" data-text="NEONCONF 2026">NEONCONF 2026</div>
      <div class="date-line" id="dateLine">11.12 -- 11.14.26</div>
    </div>
  </div>

  <!-- ===== SCENE 2: Venue Teaser (2.5s-5s) ===== -->
  <div class="composition"
       data-composition-id="scene-2-venue"
       data-start="2.5" data-duration="2.5" data-track-index="2">
    <div class="grid-bg"></div>
    <div class="bg-glow cyan" id="glow2" style="top:60%;left:50%;transform:translate(-50%,-50%);"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:30px;z-index:2;">
      <div class="venue-wireframe" id="venueWireframe"></div>
      <div class="venue-label" id="venueLabel">SAN FRANCISCO</div>
    </div>
  </div>

  <!-- ===== SCENE 3: Speaker Aria Chen (5s-8s) ===== -->
  <div class="composition"
       data-composition-id="scene-3-speaker-aria"
       data-start="5" data-duration="3" data-track-index="3">
    <div class="grid-bg"></div>
    <div class="bg-glow pink" id="glow3" style="top:40%;left:30%;transform:translate(-50%,-50%);"></div>
    <div class="speaker-card">
      <div class="speaker-photo" id="photoAria">&#x1F469;&#x200D;&#x1F4BB;</div>
      <div class="speaker-info">
        <div class="speaker-name glitch-text" id="nameAria" data-text="Dr. Aria Chen">Dr. Aria Chen</div>
        <div class="speaker-role" id="roleAria">AI Ethics / Stanford</div>
      </div>
    </div>
  </div>

  <!-- ===== SCENE 4: Speaker Marcus Webb (8s-11s) ===== -->
  <div class="composition"
       data-composition-id="scene-4-speaker-marcus"
       data-start="8" data-duration="3" data-track-index="4">
    <div class="grid-bg"></div>
    <div class="bg-glow cyan" id="glow4" style="top:40%;left:30%;transform:translate(-50%,-50%);"></div>
    <div class="speaker-card">
      <div class="speaker-photo cyan-border" id="photoMarcus">&#x1F468;&#x200D;&#x1F4BC;</div>
      <div class="speaker-info">
        <div class="speaker-name glitch-text" id="nameMarcus" data-text="Marcus Webb">Marcus Webb</div>
        <div class="speaker-role" id="roleMarcus">CEO / SynthWave</div>
      </div>
    </div>
  </div>

  <!-- ===== SCENE 5A: Speaker Elena Rodriguez (11s-13s) ===== -->
  <div class="composition"
       data-composition-id="scene-5a-speaker-elena"
       data-start="11" data-duration="2" data-track-index="5">
    <div class="grid-bg"></div>
    <div class="bg-glow pink" id="glow5a" style="top:40%;left:30%;transform:translate(-50%,-50%);"></div>
    <div class="speaker-card">
      <div class="speaker-photo" id="photoElena">&#x1F469;&#x200D;&#x1F52C;</div>
      <div class="speaker-info">
        <div class="speaker-name glitch-text" id="nameElena" data-text="Elena Rodriguez">Elena Rodriguez</div>
        <div class="speaker-role" id="roleElena">CTO / QuantumLeap</div>
      </div>
    </div>
  </div>

  <!-- ===== SCENE 5B: Speaker Jay Park (13s-15s) ===== -->
  <div class="composition"
       data-composition-id="scene-5b-speaker-jay"
       data-start="13" data-duration="2" data-track-index="6">
    <div class="grid-bg"></div>
    <div class="bg-glow cyan" id="glow5b" style="top:40%;left:30%;transform:translate(-50%,-50%);"></div>
    <div class="speaker-card">
      <div class="speaker-photo cyan-border" id="photoJay">&#x1F468;&#x200D;&#x1F3A8;</div>
      <div class="speaker-info">
        <div class="speaker-name glitch-text" id="nameJay" data-text="Jay Park">Jay Park</div>
        <div class="speaker-role" id="roleJay">Design Lead / Neuralab</div>
      </div>
    </div>
  </div>

  <!-- ===== SCENE 6: Countdown + CTA (15s-20s) ===== -->
  <div class="composition"
       data-composition-id="scene-6-finale"
       data-start="15" data-duration="5" data-track-index="7">
    <div class="grid-bg"></div>
    <div class="bg-glow pink" id="glow6a" style="top:50%;left:50%;transform:translate(-50%,-50%);"></div>
    <div class="bg-glow cyan" id="glow6b" style="top:50%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;"></div>
    <div class="glow-ring" id="glowRing" style="width:600px;height:600px;top:50%;left:50%;transform:translate(-50%,-50%);"></div>
    <div style="display:flex;flex-direction:column;align-items:center;z-index:2;">
      <div class="countdown-date neon-pink glitch-text" id="countdownDate" data-text="11.12.26">11.12.26</div>
      <div class="countdown-venue" id="countdownVenue">SAN FRANCISCO</div>
      <div class="cta-text" id="ctaText">Tickets at NEONCONF.IO</div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
  (function() {
    const tl = gsap.timeline({ paused: false });

    // Helper
    function quickFlash(dur) {
      tl.fromTo('#flash', { opacity: 1 }, { opacity: 0, duration: dur, ease: 'power2.out' });
    }

    function crossfade(fromScene, toScene, dur) {
      if (fromScene) gsap.to(fromScene, { opacity: 0, duration: dur, ease: 'power2.inOut' });
      if (toScene) gsap.set(toScene, { opacity: 1 });
    }

    // Scene element refs
    const scene1 = document.querySelector('[data-composition-id="scene-1-logo"]');
    const scene2 = document.querySelector('[data-composition-id="scene-2-venue"]');
    const scene3 = document.querySelector('[data-composition-id="scene-3-speaker-aria"]');
    const scene4 = document.querySelector('[data-composition-id="scene-4-speaker-marcus"]');
    const scene5a = document.querySelector('[data-composition-id="scene-5a-speaker-elena"]');
    const scene5b = document.querySelector('[data-composition-id="scene-5b-speaker-jay"]');
    const scene6 = document.querySelector('[data-composition-id="scene-6-finale"]');

    // ===== SCENE 1: Logo Sting (0s-2.5s) =====
    tl.set(scene1, { opacity: 1 }, 0);

    // Background glow
    tl.fromTo('#glow1', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0);

    // Logo bursts in
    tl.fromTo('#logoSting',
      { opacity: 0, scale: 0, y: 20 },
      { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: 'back.out(2.2)' }, 0.2);

    // Glitch at 0.8s
    tl.call(() => {
      const el = document.querySelector('#logoSting');
      if (el) el.classList.add('active');
    }, null, 0.8);
    tl.call(() => {
      const el = document.querySelector('#logoSting');
      if (el) el.classList.remove('active');
    }, null, 1.0);

    // Date types on
    tl.fromTo('#dateLine',
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 1.2);

    // Crossfade to scene 2
    tl.call(() => crossfade(scene1, scene2, 0.3), null, 2.2);
    tl.set(scene1, { opacity: 0 }, 2.5);

    // ===== SCENE 2: Venue Teaser (2.5s-5s) =====
    tl.set(scene2, { opacity: 1 }, 2.5);

    tl.fromTo('#glow2', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 2.5);

    // Wireframe draws on
    tl.fromTo('#venueWireframe',
      { opacity: 0, scale: 0.9, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 2.7);

    // Venue label
    tl.fromTo('#venueLabel',
      { opacity: 0, y: 20, letterSpacing: '20px' },
      { opacity: 1, y: 0, letterSpacing: '10px', duration: 0.7, ease: 'power2.out' }, 3.3);

    // Scan line sweep
    tl.fromTo('#scanSweep',
      { opacity: 0, top: '0%' },
      { opacity: 1, duration: 0.01 }, 3.8);
    tl.to('#scanSweep', { top: '100%', duration: 0.8, ease: 'power1.in' }, 3.8);
    tl.to('#scanSweep', { opacity: 0, duration: 0.2 }, 4.6);

    // Crossfade to scene 3
    quickFlash(0.15);
    tl.call(() => crossfade(scene2, scene3, 0.25), null, 4.8);
    tl.set(scene2, { opacity: 0 }, 5.0);

    // ===== SCENE 3: Speaker Aria Chen (5s-8s) =====
    tl.set(scene3, { opacity: 1 }, 5);

    tl.fromTo('#glow3', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 5);

    // Photo bursts in
    tl.fromTo('#photoAria',
      { opacity: 0, scale: 0.3, y: 40 },
      { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: 'back.out(1.8)' }, 5.1);

    // Name slides from right
    tl.fromTo('#nameAria',
      { opacity: 0, x: 80 },
      { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 5.3);

    // Role slides up
    tl.fromTo('#roleAria',
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 5.6);

    // Glitch flicker
    tl.call(() => { const el = document.querySelector('#nameAria'); if (el) el.classList.add('active'); }, null, 6.5);
    tl.call(() => { const el = document.querySelector('#nameAria'); if (el) el.classList.remove('active'); }, null, 6.65);

    // Photo subtle pulse
    tl.to('#photoAria', { scale: 1.04, duration: 0.6, ease: 'sine.inOut' }, 7);
    tl.to('#photoAria', { scale: 1, duration: 0.6, ease: 'sine.inOut' }, 7.6);

    // Crossfade to scene 4
    quickFlash(0.1);
    tl.call(() => crossfade(scene3, scene4, 0.2), null, 7.85);
    tl.set(scene3, { opacity: 0 }, 8);

    // ===== SCENE 4: Speaker Marcus Webb (8s-11s) =====
    tl.set(scene4, { opacity: 1 }, 8);

    tl.fromTo('#glow4', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 8);

    // Faster pop-in
    tl.fromTo('#photoMarcus',
      { opacity: 0, scale: 0.2, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: 'back.out(1.7)' }, 8.1);

    tl.fromTo('#nameMarcus',
      { opacity: 0, x: 60, y: 20 },
      { opacity: 1, x: 0, y: 0, duration: 0.4, ease: 'power2.out' }, 8.3);

    tl.fromTo('#roleMarcus',
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 8.5);

    // Glitch
    tl.call(() => { const el = document.querySelector('#nameMarcus'); if (el) el.classList.add('active'); }, null, 9.5);
    tl.call(() => { const el = document.querySelector('#nameMarcus'); if (el) el.classList.remove('active'); }, null, 9.65);

    // Crossfade to scene 5a
    quickFlash(0.08);
    tl.call(() => crossfade(scene4, scene5a, 0.15), null, 10.85);
    tl.set(scene4, { opacity: 0 }, 11);

    // ===== SCENE 5A: Elena Rodriguez (11s-13s) =====
    tl.set(scene5a, { opacity: 1 }, 11);

    tl.fromTo('#glow5a', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power2.out' }, 11);

    tl.fromTo('#photoElena',
      { opacity: 0, scale: 0.15, y: 20 },
      { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: 'back.out(1.5)' }, 11.05);

    tl.fromTo('#nameElena',
      { opacity: 0, x: 50 },
      { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out' }, 11.2);

    tl.fromTo('#roleElena',
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' }, 11.35);

    // Glitch transition to 5b
    quickFlash(0.06);
    tl.call(() => crossfade(scene5a, scene5b, 0.12), null, 12.88);
    tl.set(scene5a, { opacity: 0 }, 13);

    // ===== SCENE 5B: Jay Park (13s-15s) =====
    tl.set(scene5b, { opacity: 1 }, 13);

    tl.fromTo('#glow5b', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power2.out' }, 13);

    tl.fromTo('#photoJay',
      { opacity: 0, scale: 0.15, y: 20 },
      { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: 'back.out(1.5)' }, 13.05);

    tl.fromTo('#nameJay',
      { opacity: 0, x: 50 },
      { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out' }, 13.2);

    tl.fromTo('#roleJay',
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' }, 13.35);

    // Crossfade to scene 6 with dramatic flash
    tl.fromTo('#flash', { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power2.out' }, 14.7);
    tl.call(() => crossfade(scene5b, scene6, 0.2), null, 14.85);
    tl.set(scene5b, { opacity: 0 }, 15);

    // ===== SCENE 6: Countdown Finale (15s-20s) =====
    tl.set(scene6, { opacity: 1 }, 15);

    // Background glows
    tl.fromTo('#glow6a', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 15);
    tl.fromTo('#glow6b', { opacity: 0 }, { opacity: 0.6, duration: 0.6, ease: 'power2.out' }, 15.2);

    // Glow ring appears
    tl.fromTo('#glowRing',
      { opacity: 0, scale: 0.5 },
      { opacity: 1, scale: 1, duration: 1, ease: 'power3.out' }, 15.3);

    // Countdown date
    tl.fromTo('#countdownDate',
      { opacity: 0, scale: 0.5, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.9, ease: 'back.out(2)' }, 15.5);

    // Venue
    tl.fromTo('#countdownVenue',
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 16.2);

    // CTA
    tl.fromTo('#ctaText',
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 16.8);

    // CTA underline
    tl.to('#ctaText', { opacity: 1 }, 17.3);
    tl.to(document.querySelector('#ctaText'), {}, 18);

    // Glow ring pulses
    [17, 18, 19].forEach((t, i) => {
      tl.to('#glowRing', { scale: 1.08, duration: 0.3, ease: 'power2.out' }, t);
      tl.to('#glowRing', { scale: 1, duration: 0.5, ease: 'power2.in' }, t + 0.3);
    });

    // Final glitch on date
    tl.call(() => { const el = document.querySelector('#countdownDate'); if (el) el.classList.add('active'); }, null, 19.2);
    tl.call(() => { const el = document.querySelector('#countdownDate'); if (el) el.classList.remove('active'); }, null, 19.4);

    // Cut to black
    tl.to('#hyperframes-canvas', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 19.7);

    // Frame adapter
    window.__hf_gsap = function(composition, currentTime) {
      tl.time(currentTime);
    };

    // Standalone preview
    let pt = 0;
    const iv = setInterval(function() {
      pt += 1/30;
      if (pt <= 20) tl.time(pt);
      else clearInterval(iv);
    }, 1000/30);

  })();
</script>

</body>
</html>
